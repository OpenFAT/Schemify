[package]
name = "hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
# Pin to the Schemify revision you build against (docs/plugins/repository.md).
schemify-abi = { git = "https://github.com/OpenFAT/Schemify", rev = "5df66f29afc869e86bd96cfe72e482108a7310f6", features = ["guest"] }

# Small modules: size over speed, no unwinding (a panic is a trap the host reports).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
