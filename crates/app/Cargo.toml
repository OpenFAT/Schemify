[package]
name = "schemify-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "schemify_app"
path = "src/lib.rs"

# The editor (D39: a separate binary from the headless core `schemify`, which runs this one
# for `schemify edit`).
[[bin]]
name = "schemify-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The core's spines, project loading, OS boundary and package manager.
schemify-cli.workspace = true
schemify-config.workspace = true
schemify-format.workspace = true
schemify-expr.workspace = true
schemify-doc.workspace = true
schemify-elab.workspace = true
schemify-netlist.workspace = true
schemify-wave.workspace = true
schemify-run.workspace = true
schemify-abi.workspace = true
schemify-plugin.workspace = true
# Path deps (no root `[workspace.dependencies]` row yet), the same way `render` names `ui`.
schemify-ui = { path = "../ui" }
schemify-render = { path = "../render" }
