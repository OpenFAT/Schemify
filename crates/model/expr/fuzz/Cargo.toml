[package]
name = "schemify-expr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
schemify-expr = { path = ".." }

# Not a member of the repository workspace: cargo-fuzz needs nightly flags
# the workspace must never see.
[workspace]

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false
bench = false
