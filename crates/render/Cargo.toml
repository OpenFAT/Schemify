[package]
name = "schemify-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
schemify-ui = { path = "../ui" }
# Waveform panes (D23): trace columns, decimation, axes.
schemify-wave.workspace = true
vello.workspace = true
vello_cpu.workspace = true
winit.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# GPU backends, one set per platform (vello draws through wgpu, D5): Vulkan with a GL
# fallback on Linux/BSD, Metal on macOS, DX12 on Windows, WebGPU on the web.
[target.'cfg(not(any(target_arch = "wasm32", target_vendor = "apple", windows)))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# `cpu_view`: the CPU-rastered 2D overlay when the browser has no WebGPU adapter (web spec §7).
web-sys = { workspace = true, features = [
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  "ImageData",
  "Node",
  "console",
] }
