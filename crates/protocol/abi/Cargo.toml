[package]
name = "schemify-abi"
description = "Plugin ABI v1 shared by the Schemify host and guests; doubles as the Rust guest SDK."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Not `workspace = true`: the workspace forbids unsafe, and `forbid` cannot be relaxed
# locally. The guest glue (extern imports) needs one module with `#![allow(unsafe_code)]`,
# so this crate denies instead of forbids. Everything else stays safe.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
# The workspace's Google Rust style guide lints (root Cargo.toml), copied because this
# crate cannot inherit `[workspace.lints]` (see above).
unwrap_used = "warn"
wildcard_imports = "warn"
needless_for_each = "warn"
string_add = "warn"
ref_option = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
must_use_candidate = "warn"

[features]
# Guest SDK: `export!`, `Host`, the input arena. Compiled only for wasm32.
guest = []

[dependencies]

[dev-dependencies]
proptest.workspace = true
# `text::push_num` is differential-tested against expr's canonical formatter.
schemify-expr.workspace = true
