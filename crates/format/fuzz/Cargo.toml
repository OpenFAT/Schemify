# cargo-fuzz harness for schemify-format (docs/dev/testing.md: fuzz every parser).
# Run from this directory with a nightly toolchain:
#   cargo +nightly fuzz run parse
#   cargo +nightly fuzz run merge3
# Not a member of the repository workspace: it needs nightly, libfuzzer-sys and its
# own lockfile, none of which belong in the stable workspace build.

[package]
name = "schemify-format-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
schemify-format = { path = ".." }

[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge3"
path = "fuzz_targets/merge3.rs"
test = false
doc = false
bench = false
