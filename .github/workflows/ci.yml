# Merge tier (docs/dev/testing.md § Tiers): every push to main or ci/*, and every PR.
# D32: Linux, macOS, Windows and Web are all tier 1 and release-blocking.
name: ci

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The workspace MSRV (Cargo.toml rust-version) and the rustc flake.lock pins: CI lints with
  # the compiler developers run, so a new stable's clippy cannot turn main red overnight.
  # Bump together with flake.lock.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Second oracle for the Verilog dialect (xschem has no Verilog golden):
      # Icarus Verilog parses and elaborates our netlists (crates/netlist/tests/iverilog.rs).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends iverilog
          echo "SCHEMIFY_IVERILOG=iverilog" >> "$GITHUB_ENV"
      - run: cargo test --workspace --no-fail-fast
      # Golden images and snapshots a test rejected (`<name>.actual.*` in CARGO_TARGET_TMPDIR):
      # a PR that changes a picture on purpose re-blesses from them without a local build.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-${{ matrix.os }}
          path: target/tmp/*.actual.*
          if-no-files-found: ignore
      # Determinism (D32): the CLI outputs every platform must write byte for byte; the
      # `determinism` job below compares them. Runs even when a test failed, so the comparison
      # still sees every platform.
      - if: ${{ !cancelled() }}
        run: cargo build -p schemify-cli --bin schemify
      - if: ${{ !cancelled() }}
        run: bash tests/determinism/run.sh "$PWD/target/debug/schemify" determinism-out
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: determinism-out
          if-no-files-found: error

  # Everything that runs in a browser builds for wasm32-unknown-unknown (D2, D32), the editor
  # included; its wasm-bindgen bundle is the `web` artifact and gets a headless-browser smoke
  # test. The CLI also builds for WASI and joins the determinism comparison under wasmtime.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (web cfg paths)
        run: >-
          cargo clippy --target wasm32-unknown-unknown -p schemify-app -p schemify-render
          -- -D warnings
      # The browser side of the OS boundary (`platform/web.rs`, web spec) lives in the core.
      - name: clippy (web cfg paths of the core)
        run: >-
          cargo clippy --target wasm32-unknown-unknown -p schemify-cli -p schemify-config --lib
          -- -D warnings
      - name: build web crates
        run: >-
          cargo build --release --target wasm32-unknown-unknown
          -p schemify-format -p schemify-expr -p schemify-doc -p schemify-elab
          -p schemify-netlist -p schemify-wave -p schemify-abi
          -p schemify-plugin -p schemify-ui -p schemify-render -p schemify-app
      - name: wasm-bindgen CLI (the version Cargo.lock pins)
        id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }},wasmtime
      - name: web bundle
        run: |
          wasm-bindgen --target web --no-typescript --out-name schemify --out-dir crates/app/web/pkg \
            target/wasm32-unknown-unknown/release/schemify-gui.wasm
          raw=$(stat -c %s crates/app/web/pkg/schemify_bg.wasm)
          gz=$(gzip -9 -c crates/app/web/pkg/schemify_bg.wasm | wc -c)
          echo "schemify_bg.wasm: $raw bytes, $gz gzip"
          # D39: wasm ≤ 8 MB compressed.
          (( gz <= 8 * 1024 * 1024 )) || { echo "::error::web bundle $gz bytes gzip > 8 MiB (D39)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: crates/app/web
      - name: browser smoke test (headless Chrome)
        run: bash tests/web/smoke.sh crates/app/web web-smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-smoke
          path: web-smoke
      # The user config runs the same Lua interpreter on every target (web spec §5): its tests
      # again on a wasm target, under wasmtime (the browser target has no test harness).
      # The WASI steps do not depend on the browser test: run them even when it failed, so its
      # failure never also hides the determinism comparison (determinism-wasi).
      - name: config tests on wasm32-wasip1
        if: ${{ !cancelled() }}
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=/tmp::/tmp
        run: cargo test --target wasm32-wasip1 -p schemify-config --test config
      - name: CLI for WASI (determinism under wasmtime)
        if: ${{ !cancelled() }}
        run: cargo build --target wasm32-wasip1 -p schemify-cli --bin schemify
      - if: ${{ !cancelled() }}
        run: >-
          bash tests/determinism/run.sh
          "wasmtime run --dir=.::/ target/wasm32-wasip1/debug/schemify.wasm"
          determinism-out
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: determinism-wasi
          path: determinism-out
          if-no-files-found: error

  # Byte-identical CLI outputs on every platform (D32, docs/dev/contributing.md rule 4).
  determinism:
    needs: [test, wasm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
      - name: compare against ubuntu
        run: |
          ls -d determinism-*
          status=0
          for d in determinism-*; do
            [ "$d" = determinism-ubuntu-latest ] && continue
            echo "== ubuntu-latest vs ${d#determinism-}"
            diff -r -x '*.log' determinism-ubuntu-latest "$d" || status=1
          done
          [ -d determinism-ubuntu-latest ] && [ "$(ls -d determinism-* | wc -l)" -eq 4 ] || {
            echo "::error::missing platform outputs"; status=1; }
          exit $status

  # The core's guest modules (Linux, Nix: Rust 1.95.0 from rust-overlay, with rust-lld): the default UI and the
  # host's test guests. ui/build.sh fails when a module reaches its size limit (200 KB) and is
  # byte-reproducible, so the last step fails when a committed module differs from its rebuild
  # (a guest source changed without its module, or a module built elsewhere): commit the
  # `guests` artifact. The optional plugins are tested in their own repositories (docs/plugins/).
  guests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
      - run: nix develop -c ui/build.sh
      # Every rebuilt module at its repository path: `gh run download <run> -n guests -D <tmp>`,
      # then `cp -r <tmp>/. .` from the repository root (gh does not overwrite files).
      - uses: actions/upload-artifact@v4
        with:
          name: guests
          path: |
            crates/plugin/tests/fixtures/*.wasm
            crates/app/assets/*.wasm
          if-no-files-found: error
      - name: host tests against the rebuilt guests
        run: nix develop -c cargo test -p schemify-plugin -p schemify-app --no-fail-fast
      # The Nix shell has ngspice, Xyce, Icarus and OpenVAF: the run crate's real-tool
      # differentials (Monte Carlo seeds, corner paths, OSDI and VVP compiles) must run here,
      # so a missing tool fails instead of skipping (docs/dev/testing.md `run`).
      - name: run tests against the real simulators and compilers
        if: ${{ !cancelled() }}
        env:
          SCHEMIFY_REQUIRE_SIMULATORS: "1"
        run: nix develop -c cargo test -p schemify-run --no-fail-fast
      - name: committed modules equal the rebuild (reproducible guests)
        if: ${{ !cancelled() }}
        run: |
          changed="$(git status --porcelain -- '*.wasm')"
          [ -z "$changed" ] && exit 0
          echo "$changed"
          echo "::error::the committed guest modules differ from ui/build.sh output: commit the guests artifact of this run"
          exit 1

  flake:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_NAME || 'schemify' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - run: nix flake check -L
      - run: nix build -L .#schemify
      - name: packaged binary runs
        run: ./result/bin/schemify --help
