# Merge tier (TESTING.md § Tiers): every push to main or ci/*, and every PR.
# D32: Linux, macOS, Windows and Web are all tier 1 and release-blocking.
name: ci

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The workspace MSRV (Cargo.toml rust-version) and the rustc flake.lock pins: CI lints with
  # the compiler developers run, so a new stable's clippy cannot turn main red overnight.
  # Bump together with flake.lock.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Second oracle for the Verilog dialect (xschem has no Verilog golden):
      # Icarus Verilog parses and elaborates our netlists (crates/netlist/tests/iverilog.rs).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends iverilog
          echo "SCHEMIFY_IVERILOG=iverilog" >> "$GITHUB_ENV"
      - run: cargo test --workspace --no-fail-fast
      # Golden images and snapshots a test rejected (`<name>.actual.*` in CARGO_TARGET_TMPDIR):
      # a PR that changes a picture on purpose re-blesses from them without a local build.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-${{ matrix.os }}
          path: target/tmp/*.actual.*
          if-no-files-found: ignore
      # Determinism (D32): the CLI outputs every platform must write byte for byte; the
      # `determinism` job below compares them. The test run above already built the binary.
      # Runs even when a test failed, so the comparison still sees every platform.
      - if: ${{ !cancelled() }}
        run: cargo build -p schemify-cli --bin schemify
      - if: ${{ !cancelled() }}
        run: bash tests/determinism/run.sh "$PWD/target/debug/schemify" determinism-out
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: determinism-out
          if-no-files-found: error

  # Everything that runs in a browser builds for wasm32-unknown-unknown (D2, D32), the editor
  # included; its wasm-bindgen bundle is the `web` artifact and gets a headless-browser smoke
  # test. The CLI also builds for WASI and joins the determinism comparison under wasmtime.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (web cfg paths)
        run: >-
          cargo clippy --target wasm32-unknown-unknown -p schemify-app -p schemify-render
          -- -D warnings
      - name: build web crates
        run: >-
          cargo build --release --target wasm32-unknown-unknown
          -p schemify-format -p schemify-expr -p schemify-doc -p schemify-elab
          -p schemify-netlist -p schemify-import -p schemify-wave -p schemify-abi
          -p schemify-plugin -p schemify-ui -p schemify-render -p schemify-app
      - name: wasm-bindgen CLI (the version Cargo.lock pins)
        id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }},wasmtime
      - name: web bundle
        run: |
          wasm-bindgen --target web --no-typescript --out-name schemify --out-dir crates/app/web/pkg \
            target/wasm32-unknown-unknown/release/schemify-gui.wasm
          raw=$(stat -c %s crates/app/web/pkg/schemify_bg.wasm)
          gz=$(gzip -9 -c crates/app/web/pkg/schemify_bg.wasm | wc -c)
          echo "schemify_bg.wasm: $raw bytes, $gz gzip"
          # D39: wasm ≤ 8 MB compressed.
          (( gz <= 8 * 1024 * 1024 )) || { echo "::error::web bundle $gz bytes gzip > 8 MiB (D39)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: crates/app/web
      - name: browser smoke test (headless Chrome)
        run: bash tests/web/smoke.sh crates/app/web web-smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-smoke
          path: web-smoke
      - name: CLI for WASI (determinism under wasmtime)
        run: cargo build --target wasm32-wasip1 -p schemify-cli --bin schemify
      - run: >-
          bash tests/determinism/run.sh
          "wasmtime run --dir=.::/ target/wasm32-wasip1/debug/schemify.wasm"
          determinism-out
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-wasi
          path: determinism-out
          if-no-files-found: error

  # Byte-identical CLI outputs on every platform (D32, AGENTS.md rule 4), import reports
  # included (their paths are relative to the import roots, import spec §7).
  determinism:
    needs: [test, wasm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
      - name: compare against ubuntu
        run: |
          ls -d determinism-*
          status=0
          for d in determinism-*; do
            [ "$d" = determinism-ubuntu-latest ] && continue
            echo "== ubuntu-latest vs ${d#determinism-}"
            diff -r -x '*.log' determinism-ubuntu-latest "$d" || status=1
          done
          [ -d determinism-ubuntu-latest ] && [ "$(ls -d determinism-* | wc -l)" -eq 4 ] || {
            echo "::error::missing platform outputs"; status=1; }
          exit $status

  # Guest plugins (Linux, Nix: Zig 0.17 for extern/cktimg, wasm-ld). build.sh fails when a module
  # reaches its size limit (200 KB; cktimg 550 KB). build.sh is byte-reproducible, so the last
  # step fails when a committed module differs from its rebuild (a plugin source changed
  # without its module, or a module built elsewhere): commit the `plugin-guests` artifact.
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins -> target
      - run: nix develop -c plugins/build.sh
      # The rebuilt guests: a PR that edits a plugin downloads this artifact
      # (`gh run download <run> -n plugin-assets`) and commits the .wasm it changed.
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-assets
          path: crates/app/assets/*.wasm
          if-no-files-found: error
      # The gm/Id guest of the OTA fixture project (loaded through its manifest, not embedded):
      # a PR that edits `plugins/gmid-lut` commits it from this artifact the same way.
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-fixtures
          path: crates/app/tests/fixtures/ota/plugins/*.wasm
          if-no-files-found: error
      # Every rebuilt module at its repository path: `gh run download <run> -n plugin-guests -D
      # <tmp>`, then `cp -r <tmp>/. .` from the repository root (gh does not overwrite files).
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-guests
          path: |
            crates/plugin/tests/fixtures/*.wasm
            crates/app/assets/*.wasm
            crates/app/tests/fixtures/ota/plugins/*.wasm
            plugins/cktimg/cktimg.wasm
          if-no-files-found: error
      # The crates with native tests (rlib + the built guest driven through wasmi); the others
      # are cdylib guests whose `guest` module exists only on wasm32.
      - name: plugins workspace tests (native + built guests)
        run: >-
          nix develop -c cargo test --manifest-path plugins/Cargo.toml
          -p gmid-lut -p cktimg --no-fail-fast
      # cktimg's fixtures over the default fuel, at the manifest's fuel ceiling (10^11 per
      # event): needs an optimized wasmi, so its own profile.
      - name: cktimg over-budget fixtures at the fuel ceiling
        run: >-
          nix develop -c cargo test --profile fuel --manifest-path plugins/Cargo.toml
          -p cktimg --test guest -- --ignored over_budget --nocapture
      - name: host tests against the rebuilt guests
        run: nix develop -c cargo test -p schemify-plugin -p schemify-app --no-fail-fast
      - name: committed modules equal the rebuild (reproducible guests)
        if: ${{ !cancelled() }}
        run: |
          changed="$(git status --porcelain -- '*.wasm')"
          [ -z "$changed" ] && exit 0
          echo "$changed"
          echo "::error::the committed plugin modules differ from plugins/build.sh output: commit the plugin-guests artifact of this run"
          exit 1

  flake:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_NAME || 'schemify' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - run: nix flake check -L
      - run: nix build -L .#schemify
      - name: packaged binary runs
        run: ./result/bin/schemify --help
