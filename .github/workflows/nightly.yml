# Nightly tier (docs/dev/testing.md § Tiers): fuzzing, perf regression gate, coverage ratchet. The
# xschem differential ratchet on the full corpus runs in the interop plugin's repository
# (github.com/OmarSiwy/Schemify-Interop).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: minutes per fuzz target
        default: "60"
      only:
        description: >-
          run one job only (fuzz, perf, coverage, or the manual fuzz-corpus);
          empty runs the nightly set
        default: ""
      perf_rounds:
        description: perf rounds (the gate takes each metric's median over the rounds)
        default: "5"

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0" # = ci.yml

jobs:
  # cargo-fuzz on every harness (`<dir>/fuzz`: crates/*/fuzz), starting from the checked-in corpus. The
  # corpus carries over between nights through the actions cache and is uploaded with any
  # crash inputs; a crash fails the job and its input becomes a checked-in regression test
  # (docs/dev/testing.md).
  fuzz:
    if: ${{ !inputs.only || inputs.only == 'fuzz' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: crates/format, target: parse }
          - { dir: crates/format, target: merge3 }
          - { dir: crates/expr, target: compile }
          - { dir: crates/cli, target: rpc_decode }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MINUTES: ${{ inputs.fuzz_minutes || '60' }}
      CORPUS: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - name: seeds
        run: tests/fuzz/seeds.sh ${{ matrix.target }} "$CORPUS"
      - name: fuzz ${{ matrix.target }} for ${{ env.MINUTES }} min
        working-directory: ${{ matrix.dir }}/fuzz
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=$((MINUTES * 60)) -rss_limit_mb=4096 -timeout=30 -print_final_stats=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            ${{ env.CORPUS }}
            ${{ matrix.dir }}/fuzz/artifacts
          if-no-files-found: ignore

  # Manual only (`gh workflow run nightly.yml -f only=fuzz-corpus`): the minimized corpora to
  # check in for the merge-tier replay (`<dir>/tests/fuzz_corpus.rs`). Commits nothing:
  # download the `fuzz-corpus-<target>` artifacts and commit them as
  # <dir>/fuzz/corpus/<target>/. Seeds are the checked-in corpus and this
  # repository's own files only, so every committed input derives from nothing third-party.
  fuzz-corpus:
    if: ${{ inputs.only == 'fuzz-corpus' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: crates/format, target: parse }
          - { dir: crates/format, target: merge3 }
          - { dir: crates/expr, target: compile }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MINUTES: ${{ inputs.fuzz_minutes || '60' }}
      CORPUS: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: seeds
        run: tests/fuzz/seeds.sh ${{ matrix.target }} "$CORPUS"
      # Inputs up to 4 KiB: a corpus of small inputs replays fast in debug builds.
      - name: fuzz ${{ matrix.target }} for ${{ env.MINUTES }} min
        working-directory: ${{ matrix.dir }}/fuzz
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=$((MINUTES * 60)) -max_len=4096 -rss_limit_mb=4096 -timeout=30
          -print_final_stats=1
      - name: minimize (cargo fuzz cmin)
        working-directory: ${{ matrix.dir }}/fuzz
        run: |
          cargo fuzz cmin --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          echo "$(ls "corpus/${{ matrix.target }}" | wc -l) inputs, $(du -sh "corpus/${{ matrix.target }}" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ env.CORPUS }}
          if-no-files-found: error

  # D39 budgets (each perf test asserts its own) and a > 10% regression gate against
  # tests/perf/baseline.txt, measured on this runner class.
  perf:
    if: ${{ !inputs.only || inputs.only == 'perf' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ROUNDS: ${{ inputs.perf_rounds || '5' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # The budget asserts are calibrated for D39's reference machine (a mid-range laptop), not
      # a shared runner: a miss here is a warning; the gate below is the regression check.
      # Each test reports the best of its own repetitions; the gate takes each metric's median
      # over the rounds, so one slow (or lucky) round moves nothing.
      - name: perf tests (--ignored --release, one at a time, ${{ env.ROUNDS }} rounds)
        run: |
          set -o pipefail
          missed=""
          for round in $(seq "$ROUNDS"); do
            echo "::group::round $round"
            for p in format doc elab netlist render app; do
              cargo test --release -p "schemify-$p" --test perf -- --ignored --nocapture --test-threads=1 2>&1 | tee -a perf.log || missed="$missed $p"
            done
            cargo test --release -p schemify-expr --test expr perf -- --ignored --nocapture --test-threads=1 2>&1 | tee -a perf.log || missed="$missed expr"
            echo "::endgroup::"
          done
          grep -a '^PERF ' perf.log > perf-results.txt || true
          [ -z "$missed" ] || echo "::warning::perf tests failed (D39 budget asserts on this runner?):$missed"
      - name: regression gate (tests/perf/baseline.txt, > 10% fails)
        if: always()
        run: tests/perf/gate.sh perf-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: |
            perf.log
            perf-results.txt

  # Coverage as a gap-finder (docs/dev/testing.md): workspace line coverage of `cargo test` may not
  # fall below the floor in tests/coverage/floor.txt (tests/coverage/ratchet.sh). Test
  # failures are the merge tier's to report; this job measures coverage regardless.
  coverage:
    if: ${{ !inputs.only || inputs.only == 'coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov (workspace tests)
        run: >-
          cargo llvm-cov --workspace --ignore-run-fail
          --json --summary-only --output-path coverage.json
      - name: ratchet (tests/coverage/floor.txt)
        run: tests/coverage/ratchet.sh coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: ignore
