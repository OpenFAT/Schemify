# Nightly tier (TESTING.md § Tiers): xschem differential ratchet on the full corpus, fuzzing,
# perf regression gate.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: minutes per fuzz target
        default: "60"

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0" # = ci.yml

jobs:
  # Goldens from a pinned xschem (nix), our netlists of every bench, spicecmp comparison;
  # fails when the agree counts drop below tests/corpus/RATCHET.md.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: fetch corpus (pinned, sparse)
        run: tests/corpus/fetch.sh
      - name: golden netlists from pinned xschem (nix)
        run: tests/corpus/golden.sh
      - name: goldens report
        if: always()
        run: cat tests/corpus/.cache/golden/REPORT.txt
      - name: comparator self-checks on real goldens
        run: cargo test --release -p schemify-spicecmp -- --include-ignored
      - name: differential vs xschem
        run: >-
          SCHEMIFY_CORPUS=tests/corpus/.cache
          cargo test -p schemify-netlist --release --test corpus -- --nocapture
      - name: ratchet (RATCHET.md)
        run: tests/corpus/ratchet.sh tests/corpus/.cache/netlist-out/TABLE.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-results
          path: |
            tests/corpus/.cache/golden/REPORT.txt
            tests/corpus/.cache/netlist-out/TABLE.md
            tests/corpus/.cache/netlist-out/RESULTS.txt
          if-no-files-found: ignore

  # cargo-fuzz on every harness (crates/*/fuzz). The corpus carries over between nights through
  # the actions cache and is uploaded with any crash inputs; a crash fails the job and its
  # input becomes a checked-in regression test (TESTING.md).
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: format, target: parse }
          - { crate: format, target: merge3 }
          - { crate: expr, target: compile }
          - { crate: import, target: xschem_read }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MINUTES: ${{ inputs.fuzz_minutes || '60' }}
      CORPUS: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - name: seeds
        run: |
          mkdir -p "$CORPUS"
          case "${{ matrix.target }}" in
            parse) find crates/*/tests/fixtures -name '*.sh*' -type f -exec cp {} "$CORPUS"/ \; ;;
            xschem_read)
              # Real PDK files (TESTING.md: seeded with real PDK files) plus the hand-written set.
              tests/corpus/fetch.sh >/dev/null
              find tests/corpus/.cache/src tests/determinism/xschem \( -name '*.sch' -o -name '*.sym' \) \
                -type f -size -64k | head -4000 | while read -r f; do cp "$f" "$CORPUS/$(echo "$f" | sha1sum | cut -c1-16)"; done ;;
          esac
          echo "$(ls "$CORPUS" | wc -l) corpus inputs"
      - name: fuzz ${{ matrix.target }} for ${{ env.MINUTES }} min
        working-directory: crates/${{ matrix.crate }}/fuzz
        run: >-
          cargo fuzz run ${{ matrix.target }} --
          -max_total_time=$((MINUTES * 60)) -rss_limit_mb=4096 -timeout=30 -print_final_stats=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            ${{ env.CORPUS }}
            crates/${{ matrix.crate }}/fuzz/artifacts
          if-no-files-found: ignore

  # D39 budgets (each perf test asserts its own) and a > 10% regression gate against
  # tests/perf/baseline.txt, measured on this runner class.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: perf tests (--ignored --release, one at a time)
        run: |
          set -o pipefail
          status=0
          for p in format doc elab netlist render app; do
            cargo test --release -p "schemify-$p" --test perf -- --ignored --nocapture --test-threads=1 2>&1 | tee -a perf.log || status=1
          done
          cargo test --release -p schemify-expr --test expr perf -- --ignored --nocapture --test-threads=1 2>&1 | tee -a perf.log || status=1
          grep -a '^PERF ' perf.log > perf-results.txt || true
          exit $status
      - name: regression gate (tests/perf/baseline.txt, > 10% fails)
        if: always()
        run: tests/perf/gate.sh perf-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: |
            perf.log
            perf-results.txt
