# Release tier (TESTING.md § Tiers): on a `v*` tag, build `schemify`, `schemify-gui` and `devicereader` for
# Linux, macOS and Windows plus the web bundle, and attach them to a *draft* GitHub release whose
# notes are the release checklist (.github/release-notes.md): a maintainer ticks it, then
# publishes. A push to `ci/release*` runs the same builds as a dry run and publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["ci/release*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0" # = ci.yml
  # Shipped binaries (the flake's package profile): no debug info, LTO, no unwinding (D39 size).
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_PROFILE_RELEASE_PANIC: abort

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, exe: "" }
          - { os: macos-latest, name: macos-aarch64, exe: "" }
          - { os: windows-latest, name: windows-x86_64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --release --locked -p schemify-cli -p schemify-app -p schemify-devicereader
      # D39 (amended 2026-10-11): core `schemify` ≤ 2 MB, editor `schemify-gui` ≤ 10 MB.
      # ponytail: a warning until both budgets are met (docs/perf.md "Binary size"), then `::error::` + exit 1.
      - name: size gate (D39)
        run: |
          for spec in schemify:2000000 schemify-gui:10000000; do
            bin=${spec%%:*} budget=${spec##*:}
            size=$(wc -c < "target/release/$bin${{ matrix.exe }}")
            echo "$bin: $size bytes (budget $budget)"
            (( size <= budget )) || echo "::warning::$bin is $size bytes > $budget (D39)"
          done
      - name: package
        run: |
          dir="schemify-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/schemify${{ matrix.exe }} target/release/schemify-gui${{ matrix.exe }} \
            target/release/devicereader${{ matrix.exe }} \
            README.md LICENSE-MIT LICENSE-APACHE "$dir"/
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -bd "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: schemify-*-${{ matrix.name }}.*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - run: cargo build --release --locked --target wasm32-unknown-unknown -p schemify-app --bin schemify-gui
      - id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - name: package
        run: |
          wasm-bindgen --target web --no-typescript --out-name schemify --out-dir crates/app/web/pkg \
            target/wasm32-unknown-unknown/release/schemify-gui.wasm
          dir="schemify-${GITHUB_REF_NAME//\//-}-web"
          cp -R crates/app/web "$dir"
          rm -f "$dir/.gitignore"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: schemify-*-web.tar.gz

  publish:
    needs: [native, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: draft release with the checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{TAG}}/$GITHUB_REF_NAME/g; s/{{SHA}}/$GITHUB_SHA/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Schemify $GITHUB_REF_NAME" --notes-file notes.md
