# Release tier (TESTING.md § Tiers): on a `v*` tag, build `schemify`, `schemify-gui` and `devicereader` for
# Linux, macOS (Apple silicon and Intel) and Windows plus the web bundle, and attach them to a *draft*
# GitHub release whose notes are the release checklist (.github/release-notes.md): a maintainer ticks
# it, then publishes. A push to `ci/release*` runs the same builds as a dry run and publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["ci/release*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0" # = ci.yml
  # Shipped binaries (the flake's package profile): no debug info, LTO, no unwinding (D39 size).
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_PROFILE_RELEASE_PANIC: abort

jobs:
  # macOS x86_64 is cross-compiled on the Apple-silicon runner: GitHub retired its Intel
  # macOS images, and Apple's SDK builds both architectures.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-aarch64, exe: "", target: "" }
          - { os: macos-latest, name: macos-x86_64, exe: "", target: x86_64-apple-darwin }
          - { os: windows-latest, name: windows-x86_64, exe: ".exe", target: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: build
        run: >-
          cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          -p schemify-cli -p schemify-app -p schemify-devicereader
      - name: package
        run: |
          bin="target/${{ matrix.target }}/release"
          if [ -n "${{ matrix.target }}" ]; then
            file "$bin/schemify" | tee /dev/stderr | grep -q x86_64
          fi
          dir="schemify-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir "$dir"
          cp "$bin/schemify${{ matrix.exe }}" "$bin/schemify-gui${{ matrix.exe }}" \
            "$bin/devicereader${{ matrix.exe }}" \
            README.md LICENSE-MIT LICENSE-APACHE "$dir"/
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -bd "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: schemify-*-${{ matrix.name }}.*

  # Linux binaries link the build system's glibc symbol versions, so they are built in the
  # manylinux_2_28 image (AlmaLinux 8, glibc 2.28): they run on any distribution with glibc
  # ≥ 2.28 (RHEL/Alma/Rocky 8, Debian 10, Ubuntu 18.10 and later), not only on the runner's.
  # The GUI dlopens Wayland/X11/Vulkan/fontconfig at runtime, so nothing else is linked;
  # musl is not an option for it (dlopen of the desktop's glibc libraries).
  linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      GLIBC_MAX: "2.28"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --release --locked -p schemify-cli -p schemify-app -p schemify-devicereader
      - name: glibc floor (no symbol newer than GLIBC_${{ env.GLIBC_MAX }})
        run: |
          command -v objdump >/dev/null || dnf install -y -q binutils
          for b in schemify schemify-gui devicereader; do
            newest="$(objdump -T "target/release/$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
            echo "$b needs glibc $newest"
            [ "$(printf '%s\n%s\n' "$newest" "$GLIBC_MAX" | sort -V | tail -n 1)" = "$GLIBC_MAX" ] \
              || { echo "::error::$b needs glibc $newest > $GLIBC_MAX"; exit 1; }
          done
      - name: package
        run: |
          dir="schemify-${GITHUB_REF_NAME//\//-}-linux-x86_64"
          mkdir "$dir"
          cp target/release/schemify target/release/schemify-gui target/release/devicereader \
            README.md LICENSE-MIT LICENSE-APACHE "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: schemify-*-linux-x86_64.tar.gz

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - run: cargo build --release --locked --target wasm32-unknown-unknown -p schemify-app --bin schemify-gui
      - id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - name: package
        run: |
          wasm-bindgen --target web --no-typescript --out-name schemify --out-dir crates/app/web/pkg \
            target/wasm32-unknown-unknown/release/schemify-gui.wasm
          dir="schemify-${GITHUB_REF_NAME//\//-}-web"
          cp -R crates/app/web "$dir"
          rm -f "$dir/.gitignore"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: schemify-*-web.tar.gz

  publish:
    needs: [native, linux, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: draft release with the checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{TAG}}/$GITHUB_REF_NAME/g; s/{{SHA}}/$GITHUB_SHA/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Schemify $GITHUB_REF_NAME" --notes-file notes.md
