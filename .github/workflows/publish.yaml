# Release tier (docs/dev/testing.md § Tiers). On a `v*` tag: build `schemify` and `schemify-gui` for
# Linux, macOS (Apple silicon and Intel) and Windows; the web bundle; .deb, .rpm and Arch
# packages and an AUR PKGBUILD from the Linux binaries; SHA256SUMS. ESPice, the default
# simulator, is an external program: nothing here builds or ships it. All of it goes to a *draft*
# GitHub release whose notes are the release checklist (.github/release-notes.md): a maintainer
# ticks it, then publishes. Publishing the release adds it to sources.json on main (the
# `sources` job), which the flake's versioned packages install without compiling
# (`nix run 'github:OmarSiwy/Schemify#latest'`), tests the Homebrew formula and the AUR
# package and, given HOMEBREW_TAP_TOKEN and AUR_SSH_PRIVATE_KEY, pushes them to the
# OmarSiwy/homebrew-schemify tap and to schemify-bin (the `homebrew` and `aur` jobs). A push
# to `ci/release*` runs the builds as a dry run and publishes nothing.
name: publish

on:
  push:
    tags: ["v*"]
    branches: ["ci/release*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: "2.48.0"
  RUST_TOOLCHAIN: "1.95.0" # = ci.yml
  # Shipped binaries (the flake's package profile): no debug info, LTO, no unwinding (D39 size).
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_PROFILE_RELEASE_PANIC: abort

jobs:
  # macOS x86_64 is cross-compiled on the Apple-silicon runner: GitHub retired its Intel
  # macOS images, and Apple's SDK builds both architectures.
  native:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-aarch64, exe: "", target: "" }
          - { os: macos-latest, name: macos-x86_64, exe: "", target: x86_64-apple-darwin }
          - { os: windows-latest, name: windows-x86_64, exe: ".exe", target: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: build
        run: |
          target="${{ matrix.target && format('--target {0}', matrix.target) || '' }}"
          cargo build --release --locked $target -p schemify-cli -p schemify-app
      - name: package
        run: |
          bin="target/${{ matrix.target }}/release"
          if [ -n "${{ matrix.target }}" ]; then
            file "$bin/schemify" | tee /dev/stderr | grep -q x86_64
          fi
          dir="schemify-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir "$dir"
          cp "$bin/schemify${{ matrix.exe }}" "$bin/schemify-gui${{ matrix.exe }}" \
            README.md LICENSE "$dir"/
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -bd "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: schemify-*-${{ matrix.name }}.*

  # Linux binaries link the build system's glibc symbol versions, so they are built in the
  # manylinux_2_28 image (AlmaLinux 8, glibc 2.28): they run on any distribution with glibc
  # ≥ 2.28 (RHEL/Alma/Rocky 8, Debian 10, Ubuntu 18.10 and later), not only on the runner's.
  # The GUI dlopens Wayland/X11/Vulkan/fontconfig at runtime, so nothing else is linked;
  # musl is not an option for it (dlopen of the desktop's glibc libraries).
  linux:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      GLIBC_MAX: "2.28"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --release --locked -p schemify-cli -p schemify-app
      - name: glibc floor (no symbol newer than GLIBC_${{ env.GLIBC_MAX }})
        run: |
          command -v objdump >/dev/null || dnf install -y -q binutils
          for b in schemify schemify-gui; do
            newest="$(objdump -T "target/release/$b" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
            echo "$b needs glibc $newest"
            [ "$(printf '%s\n%s\n' "$newest" "$GLIBC_MAX" | sort -V | tail -n 1)" = "$GLIBC_MAX" ] \
              || { echo "::error::$b needs glibc $newest > $GLIBC_MAX"; exit 1; }
          done
      - name: package
        run: |
          dir="schemify-${GITHUB_REF_NAME//\//-}-linux-x86_64"
          mkdir "$dir"
          cp target/release/schemify target/release/schemify-gui \
            README.md LICENSE "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: schemify-*-linux-x86_64.tar.gz

  web:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      # SIMD128 for the browser build only (ci.yml's `build web crates` says why).
      - run: cargo build --release --locked --target wasm32-unknown-unknown -p schemify-app --bin schemify-gui
        env:
          RUSTFLAGS: -C target-feature=+simd128
      - id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - name: package
        run: |
          wasm-bindgen --target web --no-typescript --out-name schemify --out-dir crates/view/app/web/pkg \
            target/wasm32-unknown-unknown/release/schemify-gui.wasm
          dir="schemify-${GITHUB_REF_NAME//\//-}-web"
          cp -R crates/view/app/web "$dir"
          rm -f "$dir/.gitignore"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: schemify-*-web.tar.gz

  # .deb, .rpm and Arch packages of the Linux archive's binaries (packaging/nfpm.yaml), and the
  # AUR PKGBUILD (packaging/aur/PKGBUILD.in) with the archive's version and checksum filled in.
  distro:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist
      - name: nfpm ${{ env.NFPM_VERSION }}
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -fsSLO "$base/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "$base/checksums.txt"
          grep " nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz\$" checksums.txt | sha256sum -c -
          tar xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
      - name: packages
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          tar xzf "dist/schemify-$tag-linux-x86_64.tar.gz" -C dist
          export SCHEMIFY_DIR="$PWD/dist/schemify-$tag-linux-x86_64"
          # A dry run's ref is a branch: package it as version 0.0.0.
          export SCHEMIFY_VERSION="$(echo "${tag#v}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || echo 0.0.0)"
          mkdir -p pkg
          # nfpm expands no variables in `contents`: render the paths and the version first.
          envsubst '$SCHEMIFY_DIR $SCHEMIFY_VERSION' < packaging/nfpm.yaml > nfpm.yaml
          for p in deb rpm archlinux; do
            ./nfpm package --config nfpm.yaml --packager "$p" --target pkg/
          done
          sha="$(sha256sum "dist/schemify-$tag-linux-x86_64.tar.gz" | cut -d' ' -f1)"
          sed "s/@VERSION@/$SCHEMIFY_VERSION/; s/@SHA256@/$sha/" packaging/aur/PKGBUILD.in > pkg/PKGBUILD
          ls -l pkg
      # Each package installs and runs on its distribution.
      - name: smoke (Debian, Fedora, Arch)
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" debian:stable sh -c \
            'apt-get update -qq && apt-get install -y -qq /pkg/*.deb >/dev/null && schemify --version'
          docker run --rm -v "$PWD/pkg:/pkg" fedora:latest sh -c \
            'dnf install -y -q /pkg/*.rpm && schemify --version'
          docker run --rm -v "$PWD/pkg:/pkg" archlinux:latest sh -c \
            'pacman -U --noconfirm /pkg/*.pkg.tar.zst >/dev/null && schemify --version'
      - uses: actions/upload-artifact@v4
        with:
          name: release-distro
          path: pkg/*

  publish:
    needs: [native, linux, web, distro]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # The Homebrew formula over the macOS and Linux x86_64 archives (packaging/homebrew/).
      - name: Homebrew formula
        run: |
          tag="$GITHUB_REF_NAME"
          sum() { sha256sum "dist/schemify-$tag-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/${tag#v}/g" \
            -e "s/@MACOS_AARCH64_SHA256@/$(sum macos-aarch64)/" \
            -e "s/@MACOS_X86_64_SHA256@/$(sum macos-x86_64)/" \
            -e "s/@LINUX_X86_64_SHA256@/$(sum linux-x86_64)/" \
            packaging/homebrew/schemify.rb.in > dist/schemify.rb
          if grep -n '@[A-Z0-9_]*@' dist/schemify.rb dist/PKGBUILD; then
            echo "::error::a template field was left unfilled"; exit 1
          fi
      # sources.json (the `sources` job) reads the archives' hashes from here.
      - name: SHA256SUMS
        run: cd dist && sha256sum * | tee SHA256SUMS
      - name: draft release with the checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{TAG}}/$GITHUB_REF_NAME/g; s/{{SHA}}/$GITHUB_SHA/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Schemify $GITHUB_REF_NAME" --notes-file notes.md

  # A published release joins sources.json on main, through a pull request like any change:
  # tools/update-sources.py lists every published release with its SHA256SUMS. A pull request
  # opened with GITHUB_TOKEN starts no workflow, so ci.yml is dispatched on the branch, and
  # auto-merge (when the repository allows it) lands it once the checks pass.
  sources:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: python3 tools/update-sources.py
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: the new release installs and runs from sources.json
        run: |
          git diff --quiet sources.json && exit 0
          git add sources.json
          # `nix run` would start the package's main program, the editor: check the core.
          nix shell ".#\"${TAG#v}\"" --print-build-logs -c schemify --version
          nix shell ".#latest" -c schemify --version
      - name: pull request
        run: |
          git diff --cached --quiet sources.json && exit 0
          branch="sources/${TAG}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "nix: sources.json for ${TAG}" -- sources.json
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "nix: sources.json for ${TAG}" \
            --body "Generated by publish.yaml from the ${TAG} assets and SHA256SUMS; \`nix shell .#latest -c schemify --version\` ran on it."
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --auto --merge || echo "::notice::auto-merge unavailable: merge the sources PR by hand"

  # The Homebrew formula the release attached, installed through a local tap on macOS from the
  # published archives and run by its own `test do`. With a HOMEBREW_TAP_TOKEN secret
  # (contents: write on OmarSiwy/homebrew-schemify) the formula is pushed to that tap:
  # `brew install OmarSiwy/schemify/schemify`. Runs when the release is published: a draft's
  # archives are not downloadable by URL.
  homebrew:
    if: github.event_name == 'release'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Install and test the formula
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p schemify.rb
          brew tap-new --no-git schemify/local
          cp schemify.rb "$(brew --repository schemify/local)/Formula/schemify.rb"
          brew install schemify/local/schemify
          brew test schemify/local/schemify
          schemify --version
      - name: Push to OmarSiwy/homebrew-schemify
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/OmarSiwy/homebrew-schemify.git" tap
          mkdir -p tap/Formula && cp schemify.rb tap/Formula/schemify.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/schemify.rb
          git diff --cached --quiet || { git commit -m "schemify $TAG"; git push; }
      - name: No tap token
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; the formula was tested, not pushed"

  # The AUR package the release attached: makepkg in Arch downloads the published archive,
  # checks it against the PKGBUILD's sha256, and the package it builds must install and run.
  # With an AUR_SSH_PRIVATE_KEY secret (an AUR account's key) the PKGBUILD and its .SRCINFO
  # are pushed to schemify-bin.
  aur:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Build, install and run schemify-bin
        run: |
          set -euo pipefail
          mkdir aur && cd aur
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p PKGBUILD
          docker run --rm -v "$PWD:/aur" archlinux:latest sh -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder && chown -R builder /aur
            su builder -c "cd /aur && makepkg --noconfirm && makepkg --printsrcinfo > .SRCINFO"
            pacman -U --noconfirm /aur/schemify-bin-*.pkg.tar.zst >/dev/null
            schemify --version'
      - name: Push to the AUR
        if: env.AUR_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/schemify-bin.git schemify-bin
          cp aur/PKGBUILD aur/.SRCINFO schemify-bin/
          cd schemify-bin
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -m "schemify-bin ${TAG#v}"; git push; }
      - name: No AUR key
        if: env.AUR_KEY == ''
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set; schemify-bin was built and tested, not pushed"
