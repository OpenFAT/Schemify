[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
exclude = ["tools/fmtbench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
schemify-format = { path = "crates/format" }
schemify-expr = { path = "crates/expr" }
schemify-doc = { path = "crates/doc" }
schemify-elab = { path = "crates/elab" }
schemify-netlist = { path = "crates/netlist" }
schemify-import = { path = "crates/import" }
schemify-wave = { path = "crates/wave" }
schemify-run = { path = "crates/run" }
# third-party (justify additions in the PR, AGENTS.md rule 7)
rustfft = "6"
libm = "0.2"
thiserror = "2"
proptest = "1"

[profile.release]
debug = 1

[profile.test]
opt-level = 1
