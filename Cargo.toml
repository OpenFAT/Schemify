# Schemify's public crates: the file format, the plugin ABI and the plugin sandbox host.
# The editor and the core live in a separate, private repository.
[workspace]
resolver = "3"
members = ["crates/protocol/format", "crates/protocol/abi", "crates/plugins/plugin"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Google Rust style guide (docs/dev/contributing.md § Google Rust style guide): the rules a
# lint can check. clippy.toml exempts tests from unwrap_used.
unwrap_used = "warn"
wildcard_imports = "warn"
needless_for_each = "warn"
string_add = "warn"
ref_option = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
must_use_candidate = "warn"

[workspace.dependencies]
schemify-format = { path = "crates/protocol/format" }
schemify-abi = { path = "crates/protocol/abi" }
schemify-plugin = { path = "crates/plugins/plugin" }
proptest = { version = "1", default-features = false, features = ["std"] }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch", "deterministic"] }
