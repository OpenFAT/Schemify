[workspace]
resolver = "3"
members = ["crates/*/*", "tools/*"]
exclude = ["tools/fmtbench"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Google Rust style guide (docs/dev/contributing.md § Google Rust style guide): the rules a
# lint can check. clippy.toml exempts tests from unwrap_used.
unwrap_used = "warn"
wildcard_imports = "warn"
needless_for_each = "warn"
string_add = "warn"
ref_option = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
must_use_candidate = "warn"

[workspace.dependencies]
schemify-format = { path = "crates/protocol/format" }
schemify-expr = { path = "crates/model/expr" }
schemify-doc = { path = "crates/model/doc" }
schemify-elab = { path = "crates/model/elab" }
schemify-netlist = { path = "crates/model/netlist" }
schemify-wave = { path = "crates/model/wave" }
schemify-run = { path = "crates/model/run" }
schemify-abi = { path = "crates/protocol/abi" }
schemify-plugin = { path = "crates/plugins/plugin" }
schemify-spicecmp = { path = "tools/spicecmp" }
schemify-config = { path = "crates/model/config" }
schemify-cli = { path = "crates/model/cli" }
schemify-canvas = { path = "crates/model/canvas" }
schemify-ui = { path = "crates/model/ui" }
schemify-editor = { path = "crates/model/editor" }
schemify-render = { path = "crates/view/render" }
# third-party (justify additions in the PR, docs/dev/contributing.md rule 7)
# Dev-only: the differential oracle of expr's own FFT (D39 size cut).
rustfft = "6"
libm = "0.2"
# The netlist deck writer (user decision 2026-10-24): SpiceRack's IR and its xschem-layout
# codegen; only `netlist` may depend on it. No default features: no Python, no simulator
# backends (processes, temp files, dlopen), so it builds for the web.
# Pinned to a rev, so the plugin repositories (git dependencies on the model's crates)
# resolve it too.
spicerack = { git = "https://github.com/OmarSiwy/SpiceRack", rev = "86ab039e30faa34dfef39782130d63c469de2f20", default-features = false }
# User config (D9 amended): Lua 5.4 in pure Rust (no C, builds for every target incl. the
# web; user decision 2026-10-12, web spec §5); only `config` may use it. No `io`, `os`,
# `package` libraries are compiled in; `debug` serves the API prelude and is stripped after.
omnilua = { version = "0.7.1", default-features = false, features = ["debug", "utf8"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# D3: the one plugin engine (native + web); only `plugin` may depend on it (AGENTS rule 7).
# No `wat` (text parser) or `memory64` in production; `deterministic` canonicalizes NaNs so
# plugin results are bit-identical on every platform (rule 4, D20 cached values). Measured
# 2026-10-12 (release, stripped): wasmparser (with `validate`'s validator) is ~650 KB of code but stays,
# since plugins are untrusted input; `portable-dispatch` instead of `auto-dispatch` saves
# nothing (+4 KB) and runs a guest loop 3x slower.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch", "deterministic"] }
# GUI (WS5): only crates/model/ui and crates/view/render may use these (docs/dev/contributing.md rule 7)
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
parley = { version = "0.12", default-features = false, features = ["std", "system"] }
# Only to pick fontique's features: system fonts (fallback for glyphs outside the embedded
# subset) found through a dlopen'ed fontconfig, so nothing links libfontconfig at build time.
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }
accesskit = "0.25"
accesskit_winit = "0.34"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-font = "0.1.14"
# Only metrics and advances of the embedded faces: no autohinter shaping (the renderer's
# glyph rasterizer turns it on).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# No `wayland-csd-adwaita` (D39: tiny-skia + ab_glyph + ttf-parser for a title bar). Where the
# compositor has no server-side decorations (GNOME) the window gets smithay's plain fallback
# frame: move/resize/close/maximize/minimize, no title text, no Adwaita styling.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# The canvas tables' geometry (`canvas`, `render`): the kurbo vello_cpu uses, so all name one
# `Rect`.
kurbo = { version = "0.13", default-features = false, features = ["std"] }
# Colours, brushes, fonts and images (`render`): the peniko vello_cpu uses.
peniko = { version = "0.6", default-features = false, features = ["std"] }
# Docs-page PNG decoding in the headless editor: the decoder vello_cpu already links.
png = { version = "0.18", default-features = false }
# Render's own instanced pipelines (WGSL); render picks the backends per target.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
# render's test that its shaders compile for WebGL2: the naga wgpu links, its GLSL writer on.
naga = { version = "30", default-features = false, features = ["wgsl-in", "glsl-out"] }
vello_cpu = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[profile.release]
debug = 1

# D39 binary size (docs/dev/perf.md "Binary size"): code that is cold at run time is optimized for
# size; the hot paths (parse, load, elaborate, netlist, expressions, waveforms, wasmi, render,
# vello_cpu, text shaping, layout) stay at opt-level 3. The binary crates themselves
# (schemify-cli, schemify-app) take no override: cargo then drops `CARGO_PROFILE_RELEASE_STRIP`
# for their link (cargo 1.95), and the release env would ship symbols.
[profile.release.package]
# Core: runner, user config.
schemify-run = { opt-level = "z" }
schemify-config = { opt-level = "z" }
# The user config's Lua (omnilua, pure Rust): cold (startup, keymap and hook calls), bounded by
# its 10^8-instruction budget.
omnilua = { opt-level = "z" }
lua-vm = { opt-level = "z" }
lua-stdlib = { opt-level = "z" }
lua-parse = { opt-level = "z" }
lua-lex = { opt-level = "z" }
lua-code = { opt-level = "z" }
lua-types = { opt-level = "z" }
lua-gc = { opt-level = "z" }
# Editor: accessibility over D-Bus (kept: accessibility is not optional) and its async runtime.
accesskit = { opt-level = "z" }
accesskit_atspi_common = { opt-level = "z" }
accesskit_consumer = { opt-level = "z" }
accesskit_unix = { opt-level = "z" }
accesskit_winit = { opt-level = "z" }
atspi = { opt-level = "z" }
atspi-common = { opt-level = "z" }
atspi-proxies = { opt-level = "z" }
zbus = { opt-level = "z" }
zbus_names = { opt-level = "z" }
zbus_xml = { opt-level = "z" }
zbus-lockstep = { opt-level = "z" }
zvariant = { opt-level = "z" }
quick-xml = { opt-level = "z" }
serde = { opt-level = "z" }
serde_core = { opt-level = "z" }
serde_json = { opt-level = "z" }
async-broadcast = { opt-level = "z" }
async-channel = { opt-level = "z" }
async-executor = { opt-level = "z" }
async-io = { opt-level = "z" }
async-lock = { opt-level = "z" }
async-process = { opt-level = "z" }
async-signal = { opt-level = "z" }
async-task = { opt-level = "z" }
blocking = { opt-level = "z" }
event-listener = { opt-level = "z" }
event-listener-strategy = { opt-level = "z" }
futures-util = { opt-level = "z" }
futures-lite = { opt-level = "z" }
polling = { opt-level = "z" }
enumflags2 = { opt-level = "z" }
ordered-stream = { opt-level = "z" }
# Editor: windowing and input.
winit = { opt-level = "z" }
smithay-client-toolkit = { opt-level = "z" }
wayland-client = { opt-level = "z" }
wayland-backend = { opt-level = "z" }
wayland-protocols = { opt-level = "z" }
wayland-protocols-plasma = { opt-level = "z" }
wayland-protocols-wlr = { opt-level = "z" }
wayland-cursor = { opt-level = "z" }
wayland-csd-frame = { opt-level = "z" }
x11-dl = { opt-level = "z" }
x11rb = { opt-level = "z" }
x11rb-protocol = { opt-level = "z" }
xkbcommon-dl = { opt-level = "z" }
xcursor = { opt-level = "z" }
calloop = { opt-level = "z" }
calloop-wayland-source = { opt-level = "z" }
# Editor: plugin validation at load, LaTeX parsing (ratex has no feature to drop mhchem's regex), PNG.
wasmparser = { opt-level = "z" }
ratex-parser = { opt-level = "z" }
ratex-layout = { opt-level = "z" }
ratex-font = { opt-level = "z" }
ratex-types = { opt-level = "z" }
ratex-lexer = { opt-level = "z" }
regex = { opt-level = "z" }
regex-automata = { opt-level = "z" }
regex-syntax = { opt-level = "z" }
regex-lite = { opt-level = "z" }
fancy-regex = { opt-level = "z" }
aho-corasick = { opt-level = "z" }
unicode-normalization = { opt-level = "z" }
png = { opt-level = "z" }
flate2 = { opt-level = "z" }
miniz_oxide = { opt-level = "z" }
crc32fast = { opt-level = "z" }
fdeflate = { opt-level = "z" }
glifo = { opt-level = "z" }
# Editor: GPU setup and per-frame encoding (shader compile at startup, command validation): size over speed, not minimal.
ash = { opt-level = "z" }
naga = { opt-level = "s" }
wgpu = { opt-level = "s" }
wgpu-core = { opt-level = "s" }
wgpu-hal = { opt-level = "s" }
glow = { opt-level = "s" }
khronos-egl = { opt-level = "s" }
gpu-allocator = { opt-level = "s" }

[profile.test]
opt-level = 1
