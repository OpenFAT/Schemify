[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
exclude = ["tools/fmtbench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
schemify-format = { path = "crates/format" }
schemify-expr = { path = "crates/expr" }
schemify-doc = { path = "crates/doc" }
schemify-elab = { path = "crates/elab" }
schemify-netlist = { path = "crates/netlist" }
schemify-import = { path = "crates/import" }
schemify-wave = { path = "crates/wave" }
schemify-run = { path = "crates/run" }
schemify-abi = { path = "crates/abi" }
schemify-plugin = { path = "crates/plugin" }
# third-party (justify additions in the PR, AGENTS.md rule 7)
rustfft = "6"
libm = "0.2"
thiserror = "2"
proptest = "1"
# D3: the one plugin engine (native + web); only `plugin` may depend on it (AGENTS rule 7).
# No `wat` (text parser) or `memory64` in production; `deterministic` canonicalizes NaNs so
# plugin results are bit-identical on every platform (rule 4, D20 cached values).
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch", "deterministic"] }
# GUI (WS5): only crates/ui and crates/render may use these (AGENTS.md rule 7)
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
accesskit = "0.25"
accesskit_winit = "0.34"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-font = "0.1.14"
skrifa = "0.44"
winit = "0.30"
vello = "0.11"
vello_cpu = "0.3"
pollster = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[profile.release]
debug = 1

[profile.test]
opt-level = 1
