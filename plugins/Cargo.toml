# Guest plugins (the bundled default UI and examples), built for wasm32-unknown-unknown only.
#
# A workspace of its own, not a member of the root one: the root globs only `crates/*`
# and `tools/*`, so `cargo test --workspace` never builds these cdylibs (their `schemify`
# imports would not link natively on macOS/Windows). Build and refresh the host's test
# fixtures with `plugins/build.sh`.
[workspace]
resolver = "3"
members = ["hello", "bad-actor", "gmid-stub", "default-ui", "gmid-lut", "cktimg"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
schemify-abi = { path = "../crates/abi", features = ["guest"] }

# The guest tests (`cktimg/tests/guest.rs`) run imports of up to 10^11 wasmi fuel, so the
# interpreter is optimized in test builds too (the test profile inherits these).
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3

# Small fixtures: size over speed, no unwinding (a panic is a trap the host reports).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
